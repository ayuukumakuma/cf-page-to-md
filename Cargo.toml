[package]
name = "page2md"
version = "0.1.0"
edition = "2021"
description = "Cloudflare Markdown endpoint CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
slug = "0.1.6"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"

[dev-dependencies]
tempfile = "3.17.1"
wiremock = "=0.6.2"
